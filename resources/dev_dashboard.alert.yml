# Dev environment — new-dashboard V2 alert
# Runs independently at 8:30 AM ET (after the daily merge at 8:00 AM).

resources:
  alerts:
    dev_dashboard_alert:
      display_name: "Dev_Dashboard_Alert"
      query_text: |
        SELECT
          dashboard_id,
          creator_user_name AS creator,
          workspace_name,
          DATE_FORMAT(create_time, 'yyyy-MM-dd HH:mm') AS created_at
        FROM ${var.catalog}.${var.schema}.${var.table_name}
        WHERE CAST(seed_timestamp AS DATE) = CURRENT_DATE()
          AND workspace_environment = 'Dev'
          AND lifecycle_status = 'ACTIVE'
          AND create_time IS NOT NULL
        ORDER BY create_time DESC
      warehouse_id: ${var.warehouse_id}
      evaluation:
        comparison_operator: 'IS_NOT_NULL'
        source:
          name: 'dashboard_id'
          display: 'dashboard_id'
        threshold:
          value:
            string_value: '0'
        notification:
          notify_on_ok: false
          seconds_to_retrigger: 1
          subscriptions:
            - user_email: ${workspace.current_user.userName}
      custom_summary: '@ALERT_NAME - @ALERT_STATUS'
      custom_description: |
        ## @ALERT_NAME

        **Status:** @ALERT_STATUS

        **Condition:** @ALERT_COLUMN @ALERT_CONDITION @ALERT_THRESHOLD

        ### New Dashboards

        @QUERY_RESULT_TABLE

        [View Alert](@ALERT_URL)
      custom_template_format: 'MARKDOWN'
      schedule:
        pause_status: 'UNPAUSED'
        quartz_cron_schedule: '0 30 8 * * ?'
        timezone_id: 'America/New_York'
