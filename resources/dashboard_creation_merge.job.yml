# Dashboard Inventory — Daily Audit MERGE Job
# Runs daily at 8:00 AM ET to pick up new dashboards from system.access.audit.

resources:
  jobs:
    daily_audit_merge:
      name: "Dashboard Inventory \u2014 Daily Audit MERGE"

      schedule:
        quartz_cron_expression: "46 0 8 * * ?"
        timezone_id: America/New_York

      queue:
        enabled: true

      max_concurrent_runs: 1

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: table_name
          default: ${var.table_name}

      tasks:
        # --- Step 1: MERGE today's audit data ---
        - task_key: audit_merge
          notebook_task:
            notebook_path: ../src/daily_audit_merge.py
            base_parameters:
              target_table: "${var.catalog}.${var.schema}.${var.table_name}"

        # --- Step 2: Check for new dashboards and report per environment ---
        - task_key: evaluate_new_dashboards
          depends_on:
            - task_key: audit_merge
          notebook_task:
            notebook_path: ../src/evaluate_new_dashboards.py
            base_parameters:
              target_table: "${var.catalog}.${var.schema}.${var.table_name}"
