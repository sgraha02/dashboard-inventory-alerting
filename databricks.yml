# Dashboard Inventory & Alerting — Declarative Automation Bundle
# Tracks Lakeview dashboard creation across all workspaces and alerts by environment.
#
# Portable bundle: not pinned to any workspace. Deploy to any workspace by
# passing a profile, e.g.:
#   databricks bundle deploy -t dev  --profile <your-profile>
#   databricks bundle deploy -t prod --profile <your-profile>
# All data variables (catalog, schema, table_name, warehouse_id) are required
# at deploy time — pass via --var or set in target variables, e.g.:
#   databricks bundle deploy -t dev --var="catalog=uapdev,schema=sandbox_silver,warehouse_id=abc123"
bundle:
  name: dashboard_inventory_alerting
  uuid: 09f87a8e-43c4-49a2-bc0a-36f695565c75

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the inventory table
  schema:
    description: Schema for the inventory table
  table_name:
    description: Name of the dashboard inventory table
  secret_scope:
    description: Secret scope with SP credentials (sp-client-id, sp-client-secret, sp-tenant-id)
    default: ""
  warehouse_id:
    description: SQL warehouse ID for alert evaluation and sql_task execution
  admin_principal:
    description: User or group granted CAN_MANAGE on prod resources (defaults to the deployer)
    default: ${workspace.current_user.userName}

targets:
  # No workspace host is set on either target — the target workspace comes from
  # the --profile flag (or DATABRICKS_HOST) at deploy time, so the same bundle
  # works in any workspace.
  dev:
    mode: development
    default: true
    variables:
      catalog: uapdev
      schema: sandbox_silver
      table_name: dashboard_inventory_t
      warehouse_id: 4b6a42a61c9cdd9c

  prod:
    mode: production
    workspace:
      # Deployer-agnostic path so anyone can own their prod deployment.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    permissions:
      - user_name: ${var.admin_principal}
        level: CAN_MANAGE
